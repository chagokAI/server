name: Server CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: chagok_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d chagok_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:4.3.1
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports: [9092:9092]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
          --health-interval 10s --health-timeout 10s --health-retries 20
    defaults:
      run:
        working-directory: chagok
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/chagok_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-password
      KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      JOB_SCHEDULING_ENABLED: "false"
      JOB_WORKER_ENABLED: "false"
      BOOTSTRAP_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - run: ./gradlew test bootJar --no-daemon
      - name: Check deployment scripts
        working-directory: .
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s scripts/tests -v

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./chagok
          load: true
          tags: chagok-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Boot with isolated PostgreSQL and Kafka
        run: bash scripts/check-container.sh chagok-server:ci
