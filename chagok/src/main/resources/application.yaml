spring:
  application:
    name: chagok

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chagok}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    # pgvector 확장을 먼저 초기화한 뒤 Hibernate DDL을 실행한다.
    defer-datasource-initialization: false
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/extensions.sql
      encoding: UTF-8

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # 메시지 값은 JSON이다. Python 소비자도 읽어야 하므로 Java 클래스 이름이 담기는 타입 헤더는 붙이지 않는다
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        # 요청 API가 발행 확인을 기다리므로 Kafka 장애 시 기본값(최대 60초·2분) 대신 몇 초 안에 실패시킨다.
        # delivery.timeout.ms는 linger.ms + request.timeout.ms 이상이어야 한다
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
        linger.ms: 0

# DL 분석 요청 토픽(가안). 이름·파티션은 팀 합의 전 값이고, 복제 계수 1은 로컬 단일 브로커 기준이다
chagok:
  kafka:
    dl-analysis-request:
      topic: chagok.dl.analysis-request.v1
      partitions: 3
      replicas: 1
      # 위 프로듀서 대기 상한이 모두 어긋났을 때 요청 스레드를 풀어 주는 안전장치
      publish-timeout: 10s
