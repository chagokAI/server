spring:
  application:
    name: chagok

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chagok}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    # pgvector 확장을 먼저 초기화한 뒤 Hibernate DDL을 실행한다.
    defer-datasource-initialization: false
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/extensions.sql
      encoding: UTF-8
