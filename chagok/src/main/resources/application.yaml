spring:
  config:
    # Compose와 Spring이 프로젝트 루트의 동일한 로컬 환경 설정을 사용한다.
    # 테스트는 CHAGOK_ENV_FILE을 없는 경로로 지정해 개발자의 .env(클라우드 DB·브로커·토큰)를 읽지 않는다.
    import: "optional:file:${CHAGOK_ENV_FILE:.env}[.properties]"
  application:
    name: chagok

  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 40MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chagok}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    # pgvector 확장을 먼저 초기화한 뒤 Hibernate DDL을 실행한다.
    defer-datasource-initialization: false
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true
        # PostgreSQL은 DESC 정렬 시 NULL이 먼저 온다. 미매칭(비율 null)을 목록 뒤로 보낸다.
        order_by:
          default_null_ordering: last

  jackson:
    deserialization:
      # 정의된 필드 외 입력은 거부한다.
      fail-on-unknown-properties: true
      accept-float-as-int: false

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/init/extensions.sql
      encoding: UTF-8

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # 메시지 값은 JSON이다. Python 소비자도 읽어야 하므로 Java 클래스 이름이 담기는 타입 헤더는 붙이지 않는다
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        # 요청 API가 발행 확인을 기다리므로 Kafka 장애 시 기본값(최대 60초·2분) 대신 몇 초 안에 실패시킨다.
        # delivery.timeout.ms는 linger.ms + request.timeout.ms 이상이어야 한다
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
        linger.ms: 0
    # 메시지에 타입 헤더가 없으므로 받을 타입을 지정한다. 형식이 깨진 메시지는 ErrorHandlingDeserializer가 잡아
    # 컨슈머를 멈추지 않고 오류 처리기로 넘긴다
    # Spring이 소비하는 토픽은 DL Worker의 결과 토픽 하나다. 요청 토픽은 Worker 그룹(chagok-dl-worker)이 소비한다
    consumer:
      group-id: chagok-dl-result
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.skala.chagok.dlanalysis.DlAnalysisResult
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.skala.chagok.dlanalysis

# DL 분석 요청·결과 토픽. 메시지 형식은 docs/dl-kafka-contract.md, 복제 계수 1은 로컬 단일 브로커 기준이다
chagok:
  live:
    allow-remote-database: ${LIVE_ALLOW_REMOTE_DATABASE:false}
    feeder:
      enabled: ${LIVE_FEEDER_ENABLED:false}
      interval-ms: ${LIVE_FEEDER_INTERVAL_MS:167}
    reset:
      enabled: ${LIVE_RESET_ENABLED:false}
      cron: "${LIVE_RESET_CRON:0 */30 * * * *}"
  dl:
    image-root: ${DL_IMAGE_ROOT:./data/captures}
  kafka:
    dl-analysis-request:
      topic: chagok.dl.analysis-request.v1
      partitions: 3
      replicas: 1
      # 위 프로듀서 대기 상한이 모두 어긋났을 때 요청 스레드를 풀어 주는 안전장치
      publish-timeout: 10s
    dl-analysis-result:
      topic: chagok.dl.analysis-result.v1
      partitions: 3
      replicas: 1
  timezone: Asia/Seoul
  refresh-after-seconds: 300
  jobs:
    scheduling-enabled: ${JOB_SCHEDULING_ENABLED:true}
    worker-enabled: ${JOB_WORKER_ENABLED:true}
    cron: "${JOB_CRON:0 */5 * * * *}"
    poll-delay: 1000
    lookback-days: 28
    order-unit: 100
    timeout: 5m
  inventory:
    caution-buffer-days: 3
    target-days-to-stockout: 14
  # 내경 부피 기준 박스 크기 분류. S ≤ 10L < M ≤ 50L < L
  box-size:
    small-max-liters: 10
    medium-max-liters: 50
  # 박스 매칭 정책. tilted: 90도 회전으로 안 들어가는 박스에 비스듬한 배치 판정을 추가(기본 끄기, 팀 결정 전)
  matching:
    tilted:
      enabled: false
      clearance-mm: 0
    # 기준이 바뀐 DB에서 한 번만 켠다. 기동 시 모든 센터의 상품 매칭 상태를 현재 기준으로 다시 판정한다.
    resync-statuses-on-startup: ${MATCH_STATUS_RESYNC_ON_STARTUP:false}

  auth:
    enabled: ${AUTH_ENABLED:true}
  # 에이전트(business-mcp) 내부 API(/internal/**) 토큰. 비어 있으면 내부 API 전부 거부
  internal:
    token: ${INTERNAL_API_TOKEN:}
  # 박스 주문 제안 에이전트 서버(box_agent agent_server.py). 비어 있으면 AI 작업 API 는 503
  agent:
    url: ${AGENT_API_URL:}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    employee-id: ${BOOTSTRAP_EMPLOYEE_ID:}
    password: ${BOOTSTRAP_PASSWORD:}
    user-name: ${BOOTSTRAP_USER_NAME:초기 운영자}
    warehouse-id: ${BOOTSTRAP_WAREHOUSE_ID:}
    warehouse-name: ${BOOTSTRAP_WAREHOUSE_NAME:차곡 로컬 센터}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
