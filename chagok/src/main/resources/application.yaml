spring:
  application:
    name: chagok

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chagok}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    # pgvector 확장을 먼저 초기화한 뒤 Hibernate DDL을 실행한다.
    defer-datasource-initialization: false
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true
        # PostgreSQL은 DESC 정렬 시 NULL이 먼저 온다. 미매칭(비율 null)을 목록 뒤로 보낸다.
        order_by:
          default_null_ordering: last

  jackson:
    deserialization:
      # 정의된 필드 외 입력은 거부한다.
      fail-on-unknown-properties: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/extensions.sql
      encoding: UTF-8

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # 메시지 값은 JSON이다. Python 소비자도 읽어야 하므로 Java 클래스 이름이 담기는 타입 헤더는 붙이지 않는다
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        # 요청 API가 발행 확인을 기다리므로 Kafka 장애 시 기본값(최대 60초·2분) 대신 몇 초 안에 실패시킨다.
        # delivery.timeout.ms는 linger.ms + request.timeout.ms 이상이어야 한다
        max.block.ms: 3000
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
        linger.ms: 0
    # 메시지에 타입 헤더가 없으므로 받을 타입을 지정한다. 형식이 깨진 메시지는 ErrorHandlingDeserializer가 잡아
    # 컨슈머를 멈추지 않고 오류 처리기로 넘긴다
    consumer:
      group-id: chagok-dl-analysis
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.skala.chagok.dlanalysis.DlAnalysisRequest
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.skala.chagok.dlanalysis

# DL 분석 요청 토픽(가안). 이름·파티션은 팀 합의 전 값이고, 복제 계수 1은 로컬 단일 브로커 기준이다
chagok:
  kafka:
    dl-analysis-request:
      topic: chagok.dl.analysis-request.v1
      partitions: 3
      replicas: 1
      # 위 프로듀서 대기 상한이 모두 어긋났을 때 요청 스레드를 풀어 주는 안전장치
      publish-timeout: 10s
  # DL 측정 서버(chagokAI/item-dimension-api). 로컬에서 uvicorn으로 띄운 주소가 기본값
  dl:
    measure:
      base-url: ${DL_BASE_URL:http://127.0.0.1:8000}
      connect-timeout: 2s
      read-timeout: 10s
chagok:
  timezone: Asia/Seoul
  refresh-after-seconds: 300
  inventory:
    caution-buffer-days: 3
    target-days-to-stockout: 14
