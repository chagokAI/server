spring:
  application:
    name: chagok

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chagok}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    # pgvector 확장을 먼저 초기화한 뒤 Hibernate DDL을 실행한다.
    defer-datasource-initialization: false
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true
        # PostgreSQL은 DESC 정렬 시 NULL이 먼저 온다. 미매칭(비율 null)을 목록 뒤로 보낸다.
        order_by:
          default_null_ordering: last

  jackson:
    deserialization:
      # 정의된 필드 외 입력은 거부한다.
      fail-on-unknown-properties: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/extensions.sql
      encoding: UTF-8

chagok:
  timezone: Asia/Seoul
  refresh-after-seconds: 300
  inventory:
    caution-buffer-days: 3
    target-days-to-stockout: 14
