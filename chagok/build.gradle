plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '0.0.1-SNAPSHOT'
description = 'chagok'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-vector'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 발주서 PDF. HTML→PDF 변환기는 유지보수가 끊겨 있어 PDFBox로 직접 그린다.
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    // .env가 클라우드를 가리켜도 테스트 JVM은 명시한 loopback 대상만 사용한다.
    // 검사 전에 fixture/스케줄러가 기동하지 않도록 JVM 실행 직전 차단한다.
    doFirst {
        String target = System.getenv('TEST_DB_URL') ?: System.getenv('DB_URL')
        if (!target && name == 'offlineTest') target = 'jdbc:postgresql://127.0.0.1:1/chagok_offline'
        boolean valid = false
        try {
            if (target?.startsWith('jdbc:postgresql://')) {
                def uri = new URI(target.substring(5))
                valid = ['localhost', '127.0.0.1', '::1', '[::1]'].contains(uri.host?.toLowerCase(Locale.ROOT)) &&
                        uri.rawQuery == null && uri.rawFragment == null && uri.userInfo == null &&
                        uri.port != 0 && uri.port <= 65535
            }
        } catch (Exception ignored) { }
        if (!valid) throw new GradleException('Tests require an explicit loopback TEST_DB_URL or DB_URL; project .env is not a test target')
        systemProperty 'spring.datasource.url', target
        for (String key : ['USERNAME', 'PASSWORD']) {
            String value = System.getenv('TEST_DB_' + key) ?: System.getenv('DB_' + key)
            if (value != null) systemProperty 'spring.datasource.' + key.toLowerCase(Locale.ROOT), value
        }
        systemProperty 'spring.jpa.hibernate.ddl-auto', System.getenv('DDL_AUTO') ?: 'update'
    }
    // DB 주소만 막으면 .env의 브로커·계정·토큰이 그대로 들어온다. 테스트 JVM은 .env 가져오기 자체를 끈다.
    systemProperty 'CHAGOK_ENV_FILE', layout.buildDirectory.file('test-env/no-project-env').get().asFile.absolutePath
    systemProperty 'chagok.jobs.scheduling-enabled', 'false'
    systemProperty 'chagok.jobs.worker-enabled', 'false'
    systemProperty 'chagok.auth.enabled', 'false'
    systemProperty 'chagok.live.allow-remote-database', 'false'
    systemProperty 'chagok.live.feeder.enabled', 'false'
    systemProperty 'chagok.live.reset.enabled', 'false'
    systemProperty 'chagok.bootstrap.enabled', 'false'
    systemProperty 'spring.sql.init.mode', 'always'
}

// PostgreSQL을 설치하지 않은 환경에서도 API 계약·계산·매핑 검증을 실행한다.
tasks.register('offlineTest', Test) {
    description = '외부 DB 없이 실행 가능한 테스트 (내장 Kafka 포함)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        excludeTestsMatching 'com.skala.chagok.ChagokApplicationTests'
        excludeTestsMatching 'com.skala.chagok.dlanalysis.DlAnalysisFlowIntegrationTest'
        excludeTestsMatching 'com.skala.chagok.job.JobFlowIntegrationTest'
        excludeTestsMatching 'com.skala.chagok.workflow.SpringWorkflowIntegrationTest'
        excludeTestsMatching 'com.skala.chagok.workflow.AuthFlowIntegrationTest'
        // 이 두 흐름도 실제 PostgreSQL에 fixture를 넣는 통합 테스트다. test에서는 계속 실행한다.
        excludeTestsMatching 'com.skala.chagok.workflow.NotificationReadFlowTest'
        excludeTestsMatching 'com.skala.chagok.workflow.RefreshPolicyFlowTest'
        // 라이브 재고 스트림·입력기·초기화도 PostgreSQL에 fixture를 넣어 확인한다.
        excludeTestsMatching 'com.skala.chagok.live.*IntegrationTest'
    }
}
