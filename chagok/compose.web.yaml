name: chagok-web

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: ${DB_NAME:-chagok}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정하세요}
    volumes:
      - web-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    image: chagok-web-backend:local
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: web
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chagok}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 설정하세요}
      DDL_AUTO: update
      AUTH_ENABLED: "true"
      # 에이전트 business-mcp 내부 API(/internal/**) 토큰. 비어 있으면 내부 API 전부 거부. box_agent/.env 와 같은 값
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # 박스 주문 제안 에이전트 서버(box_agent compose 의 agent 서비스, 같은 docker network)
      AGENT_API_URL: ${AGENT_API_URL:-http://agent:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JOB_SCHEDULING_ENABLED: ${JOB_SCHEDULING_ENABLED:-false}
      JOB_WORKER_ENABLED: "true"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_EMPLOYEE_ID: ${BOOTSTRAP_EMPLOYEE_ID:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_USER_NAME: ${BOOTSTRAP_USER_NAME:-배포 테스트 운영자}
      BOOTSTRAP_WAREHOUSE_NAME: ${BOOTSTRAP_WAREHOUSE_NAME:-배포 테스트 센터}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped

  frontend:
    image: chagok-web-frontend:local
    build:
      context: ${CLIENT_CONTEXT:-../../client}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  web-postgres-data:
